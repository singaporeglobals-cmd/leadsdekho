<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leads Dekho — Cover</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  body{margin:0;background:#F8FAFC;}
</style>
</head>
<body>
<div class="slide">

  <!-- Right logo panel (~42%) on a soft surface with emerald glow -->
  <div class="absolute inset-y-0 right-0 overflow-hidden" style="width:42%;background:linear-gradient(160deg,#FFFFFF 0%,#F1F5F9 100%);border-left:1px solid var(--border)">
    <!-- Decorative emerald glow behind logo -->
    <div data-decor aria-hidden="true" class="absolute rounded-full" style="width:520px;height:520px;right:-150px;top:50%;transform:translateY(-50%);background:radial-gradient(closest-side, rgba(16,185,129,0.18), transparent 70%)"></div>
    <!-- Soft navy ring -->
    <div data-decor aria-hidden="true" class="absolute rounded-full" style="width:340px;height:340px;left:50%;top:50%;transform:translate(-50%,-50%);border:1px dashed rgba(15,42,67,0.18)"></div>

    <!-- Logo centered -->
    <div class="absolute inset-0 flex items-center justify-center" style="padding:48px">
      <img src="logo.jpg" alt="Leads Dekho — CRM Solutions logo" style="max-width:88%;max-height:80%;object-fit:contain;display:block">
    </div>

    <!-- Bottom brand strip -->
    <div class="absolute left-0 right-0" style="bottom:32px;text-align:center">
      <span style="font-family:var(--font-heading);font-size:var(--fs-small);color:var(--accent-deep);font-weight:700;letter-spacing:0.22em">CRM SOLUTIONS</span>
    </div>
  </div>

  <!-- Decorative emerald glow on left -->
  <div data-decor aria-hidden="true" class="absolute rounded-full" style="width:420px;height:420px;left:-160px;bottom:-190px;background:radial-gradient(closest-side, rgba(16,185,129,0.15), transparent 72%)"></div>

  <!-- Left content panel -->
  <div class="absolute inset-y-0 left-0 flex flex-col" style="width:58%;padding:62px 46px 54px 76px">
    <div class="flex items-center gap-4">
      <div class="accent-bar"></div>
      <span class="kicker" style="font-family:var(--font-heading);font-size:var(--fs-small)">PRODUCT &amp; FEATURE GUIDE</span>
    </div>

    <h1 style="font-family:var(--font-heading);font-weight:800;font-size:calc(var(--fs-display) * 1.72);line-height:1.03;letter-spacing:-0.02em;color:var(--primary);margin-top:40px">
      Leads<br><span style="color:var(--accent-deep)">Dekho</span>
    </h1>

    <p style="font-family:var(--font-heading);font-weight:600;font-size:22px;color:var(--primary);margin-top:26px">Smart Lead Management for Every Business</p>

    <p style="font-size:var(--fs-body);color:var(--muted);line-height:1.65;margin-top:12px;max-width:520px">Every lead, every follow-up, every deal — one system that works for every team, at <span style="font-weight:600;color:var(--accent-deep)">leadsdekho.in</span>.</p>

    <div class="flex items-center gap-3" style="margin-top:30px">
      <span class="chip role-admin" style="padding:8px 18px;font-size:var(--fs-small);font-family:var(--font-heading)"><span class="dot" style="background:var(--admin)"></span>Admin</span>
      <span class="chip role-presales" style="padding:8px 18px;font-size:var(--fs-small);font-family:var(--font-heading)"><span class="dot" style="background:var(--presales)"></span>Presales</span>
      <span class="chip role-sales" style="padding:8px 18px;font-size:var(--fs-small);font-family:var(--font-heading)"><span class="dot" style="background:var(--sales)"></span>Sales</span>
    </div>

    <div class="mt-auto" style="border-top:1px solid var(--border);padding-top:18px">
      <p style="font-size:var(--fs-small);color:var(--muted);font-weight:500;letter-spacing:0.04em">10 Modules&nbsp;&nbsp;·&nbsp;&nbsp;3 Roles&nbsp;&nbsp;·&nbsp;&nbsp;3 Portal Integrations&nbsp;&nbsp;·&nbsp;&nbsp;2026</p>
    </div>
  </div>

</div>
</body>
</html>
