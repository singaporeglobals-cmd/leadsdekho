<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Section 02 — Field Sales &amp; Bookings</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--primary)}
  .chapttitle{font-family:var(--font-heading);font-weight:800;font-size:64px;line-height:1.08;letter-spacing:-0.015em;color:#FFFFFF;margin:20px 0 0}
  .tagline{font-size:18px;line-height:1.65;color:rgba(255,255,255,0.78);max-width:640px;margin-top:18px}
  .pvchip{display:inline-flex;align-items:center;gap:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:16px 22px;font:600 15px var(--font-heading);color:#FFFFFF}
  .pvchip .material-icons{font-size:22px;color:var(--accent)}
</style>
</head>
<body>
<div class="slide" style="background:var(--primary)">
  <!-- decor -->
  <div data-decor aria-hidden="true" style="position:absolute;top:-220px;left:-160px;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,0.15) 0%,rgba(16,185,129,0) 66%)"></div>
  <div data-decor aria-hidden="true" style="position:absolute;top:-140px;right:-70px;width:470px;height:470px;border-radius:50%;border:1.5px solid rgba(16,185,129,0.22)"></div>
  <div data-decor aria-hidden="true" style="position:absolute;top:56px;right:118px;width:470px;height:470px;border-radius:50%;border:1px solid rgba(255,255,255,0.07)"></div>
  <div data-decor aria-hidden="true" style="position:absolute;bottom:-88px;right:36px;font:800 400px/1 var(--font-heading);color:rgba(255,255,255,0.045);letter-spacing:-0.04em">02</div>

  <div style="position:relative;height:100%;padding:0 96px;display:flex;flex-direction:column;justify-content:center">
    <div style="display:flex;align-items:center;gap:14px">
      <div class="accent-bar" style="width:56px"></div>
      <span class="num" style="font:700 16px var(--font-heading);color:var(--accent);letter-spacing:0.2em">02 / 03</span>
    </div>

    <h1 class="chapttitle">Field Sales &amp; Bookings</h1>

    <p class="tagline">Take the deal from site visit to signed booking — with a full financial and photo trail.</p>

    <div style="display:flex;gap:16px;margin-top:44px">
      <span class="pvchip"><i class="material-icons">event_available</i>Site Visits</span>
      <span class="pvchip"><i class="material-icons">receipt_long</i>Bookings</span>
    </div>
  </div>
</div>
</body>
</html>
