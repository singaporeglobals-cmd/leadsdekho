<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Section 01 — Lead Engine</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  body{margin:0;background:#0F2A43;}
  .sec-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);color:#FFFFFF;font-size:var(--fs-small);font-weight:600;font-family:var(--font-heading);}
</style>
</head>
<body>
<div class="slide" style="background:var(--primary)">

  <!-- Decorative layer -->
  <div data-decor aria-hidden="true" class="absolute" style="right:26px;top:-88px;font-family:var(--font-heading);font-weight:800;font-size:430px;line-height:1;color:rgba(255,255,255,0.05);letter-spacing:-0.04em">01</div>
  <div data-decor aria-hidden="true" class="absolute rounded-full" style="width:560px;height:560px;right:-150px;bottom:-240px;border:2px solid rgba(16,185,129,0.35)"></div>
  <div data-decor aria-hidden="true" class="absolute rounded-full" style="width:14px;height:14px;right:180px;bottom:196px;background:var(--accent)"></div>
  <div data-decor aria-hidden="true" class="absolute rounded-full" style="width:700px;height:700px;left:-280px;top:-360px;background:radial-gradient(closest-side, rgba(16,185,129,0.14), transparent 70%)"></div>

  <!-- Content -->
  <div class="relative z-10 flex flex-col justify-center h-full" style="padding:0 88px">
    <div class="flex items-center gap-4">
      <div class="accent-bar"></div>
      <span class="num" style="font-family:var(--font-heading);font-weight:700;font-size:20px;color:var(--accent);letter-spacing:0.14em">01 / 03</span>
    </div>

    <h1 style="font-family:var(--font-heading);font-weight:800;font-size:calc(var(--fs-display) * 1.65);line-height:1.05;letter-spacing:-0.02em;color:#FFFFFF;margin-top:24px">Lead Engine</h1>

    <p style="font-size:20px;color:rgba(255,255,255,0.8);line-height:1.6;margin-top:22px;max-width:680px">Capture, track and convert every enquiry — from first call to final booking.</p>

    <div class="flex items-center flex-wrap gap-3" style="margin-top:44px">
      <span class="sec-chip"><span class="dot" style="background:var(--accent)"></span>Dashboard</span>
      <span class="sec-chip"><span class="dot" style="background:var(--accent)"></span>Leads</span>
      <span class="sec-chip"><span class="dot" style="background:var(--accent)"></span>Lead Details</span>
      <span class="sec-chip"><span class="dot" style="background:var(--accent)"></span>Import Leads</span>
      <span class="sec-chip"><span class="dot" style="background:var(--accent)"></span>Portal Capture</span>
    </div>

    <div class="flex items-center gap-2" data-decor aria-hidden="true" style="margin-top:52px">
      <div style="width:56px;height:6px;border-radius:999px;background:var(--accent)"></div>
      <div style="width:56px;height:6px;border-radius:999px;background:rgba(255,255,255,0.16)"></div>
      <div style="width:56px;height:6px;border-radius:999px;background:rgba(255,255,255,0.16)"></div>
    </div>
  </div>

</div>
</body>
</html>
